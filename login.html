
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0B1220;
            color: #F1F5FF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            background: #111C2F;
            border: 1px solid #263750;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #60A5FA;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #94A3B8;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .tabs {
            display: flex;
            background: #0B1220;
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .tabs button {
            flex: 1;
            border: none;
            padding: 11px;
            border-radius: 8px;
            background: transparent;
            color: #94A3B8;
            font-weight: 600;
            cursor: pointer;
        }

        .tabs button.active {
            background: #2563EB;
            color: white;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #CBD5E1;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #334155;
            border-radius: 9px;
            background: #0B1220;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #3B82F6;
        }

        /* PASSWORD EYE BUTTON */

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #94A3B8;
            cursor: pointer;
            font-size: 19px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: #60A5FA;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: #2563EB;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background: #1D4ED8;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            font-size: 13px;
            text-align: center;
            line-height: 1.5;
        }

        .hidden {
            display: none;
        }

        @media(max-width: 480px) {
            .auth-container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <div class="logo">StudyMate</div>
        <p class="subtitle">Your personal study companion</p>

        <div class="tabs">
            <button type="button" id="loginTab" class="active">Login</button>
            <button type="button" id="signupTab">Sign Up</button>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label>Username or Email</label>
                <input type="text" id="loginIdentifier" required placeholder="Enter username or email">
            </div>

            <div class="form-group">
                <label>Password</label>

                <div class="password-wrapper">
                    <input type="password" id="loginPassword" required placeholder="Enter password">

                    <button type="button" class="toggle-password"
                        data-target="loginPassword"
                        aria-label="Show password"
                        aria-pressed="false">
                        👁
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-btn">Login</button>

        </form>

        <form id="signupForm" class="hidden">

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="signupUsername" minlength="3" required placeholder="Choose a username">
            </div>

            <div class="form-group">
                <label>Email (Optional)</label>
                <input type="email" id="signupEmail" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Password</label>

                <div class="password-wrapper">
                    <input type="password" id="signupPassword" minlength="8" required placeholder="Minimum 8 characters">

                    <button type="button" class="toggle-password"
                        data-target="signupPassword"
                        aria-label="Show password"
                        aria-pressed="false">
                        👁
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-btn">Create Account</button>

        </form>

        <p id="message" class="message"></p>

    </div>

    <script src="api.js"></script>

    <script>
        const loginTab = document.getElementById("loginTab");
        const signupTab = document.getElementById("signupTab");
        const loginForm = document.getElementById("loginForm");
        const signupForm = document.getElementById("signupForm");
        const message = document.getElementById("message");

        function showMessage(text, success = false) {
            message.textContent = text;
            message.style.color = success ? "#4ADE80" : "#F87171";
        }

        // SHOW / HIDE PASSWORD

        document.querySelectorAll(".toggle-password").forEach(button => {

            button.addEventListener("click", function () {

                const passwordInput = document.getElementById(
                    this.dataset.target
                );

                const isHidden = passwordInput.type === "password";

                passwordInput.type = isHidden ? "text" : "password";

                this.textContent = isHidden ? "🙈" : "👁";

                this.setAttribute(
                    "aria-label",
                    isHidden ? "Hide password" : "Show password"
                );

                this.setAttribute("aria-pressed", String(isHidden));

            });

        });

        loginTab.addEventListener("click", () => {
            loginForm.classList.remove("hidden");
            signupForm.classList.add("hidden");

            loginTab.classList.add("active");
            signupTab.classList.remove("active");

            showMessage("");
        });

        signupTab.addEventListener("click", () => {
            signupForm.classList.remove("hidden");
            loginForm.classList.add("hidden");

            signupTab.classList.add("active");
            loginTab.classList.remove("active");

            showMessage("");
        });

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const identifier = document.getElementById("loginIdentifier").value.trim();
            const password = document.getElementById("loginPassword").value;
            const button = loginForm.querySelector("button[type='submit']");

            button.disabled = true;
            button.textContent = "Logging in...";

            try {
                await StudyMateAPI.login(identifier, password);

                showMessage("Login successful! Redirecting...", true);
                window.location.href = "index.html";

            } catch (error) {
                showMessage(error.message || "Login failed. Please try again.");
            } finally {
                button.disabled = false;
                button.textContent = "Login";
            }
        });

        signupForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const username = document.getElementById("signupUsername").value.trim();
            const email = document.getElementById("signupEmail").value.trim();
            const password = document.getElementById("signupPassword").value;
            const button = signupForm.querySelector("button[type='submit']");

            button.disabled = true;
            button.textContent = "Creating account...";

            try {
                await StudyMateAPI.register(username, email || null, password);

                await StudyMateAPI.login(username, password);

                showMessage("Account created successfully! Redirecting...", true);
                window.location.href = "index.html";

            } catch (error) {
                showMessage(error.message || "Signup failed. Please try again.");
            } finally {
                button.disabled = false;
                button.textContent = "Create Account";
            }
        });

        // Redirect an already logged-in user
        if (StudyMateAPI.getToken()) {
            StudyMateAPI.request("/api/auth/me")
                .then(() => {
                    window.location.href = "index.html";
                })
                .catch(() => {});
        }
    </script>

</body>
</html>
